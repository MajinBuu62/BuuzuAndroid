name: Build Eden Android 2.0

on:
  push:
    branches:
      - 0.2.0-ok
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 0.2.0-ok

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Cache Android build files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            src/android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('src/android/**/*.gradle*', 'src/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y ninja-build cmake glslang-tools

      - name: Build Release APK
        run: |
          cd src/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --build-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eden-release-apk
          path: "**/*.apk"
