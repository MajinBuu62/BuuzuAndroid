name: EDEN020MOD - Task Scanner

on:
  push:
    branches:
      - 0.2.0-ok
  workflow_dispatch:

jobs:
  scan-gradle-tasks:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Eden Source
      uses: actions/checkout@v4
      with:
        ref: 0.2.0-ok

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Install Build Dependencies
      run: |
        sudo apt update
        sudo apt install -y ninja-build cmake glslang-tools ccache

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-${{ runner.os }}-

    - name: Cache Native Build Files
      uses: actions/cache@v4
      with:
        path: |
          src/android/.cxx
          ~/.ccache
        key: eden-native-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
        restore-keys: |
          eden-native-${{ runner.os }}-

    - name: Scan Available Gradle Tasks
      run: |
        cd src/android
        chmod +x gradlew
        ./gradlew tasks --all > EDEN020_Gradle_Task_List.txt

    - name: Upload Task List
      uses: actions/upload-artifact@v4
      with:
        name: EDEN020-Gradle-Task-List
        path: src/android/EDEN020_Gradle_Task_List.txt
