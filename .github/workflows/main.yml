name: Build Eden with Patch

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Checkout specific commit
        shell: bash
        run: |
          git checkout 05f36d9
          echo "Checked out to 05f36d9"

      - name: Download and Apply Custom Patch
        shell: bash
        run: |
          curl -L -f -o NS2.patch "https://files.catbox.moe/h0vz6e.patch"
          git apply NS2.patch
          echo "Patch applied successfully."

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install extra tools
        run: choco install ccache ninja wget cygwin -y

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          choco install vulkan-sdk -y
          $vulkanPath = [System.Environment]::GetEnvironmentVariable('VULKAN_SDK', 'Machine')
          Write-Output "$vulkanPath\Bin" | Out-File -FilePath "${Env:GITHUB_PATH}" -Append

      - name: CMake Configure
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DYUZU_USE_BUNDLED_QT=ON \
            -DENABLE_QT_TRANSLATION=ON \
            -DUSE_DISCORD_PRESENCE=ON \
            -DYUZU_USE_BUNDLED_VCPKG=ON \
            -DYUZU_USE_BUNDLED_SDL2=ON \
            -DUSE_CCACHE=ON \
            -DYUZU_CMD=OFF

      - name: Build Eden
        shell: bash
        run: cmake --build build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eden-windows-patched
          path: build/bin/
          if-no-files-found: error
